name: Comprobar token de Supabase

# Solo manual. Confirma que el SUPABASE_ACCESS_TOKEN guardado en el Environment
# "production" puede leer las Edge Functions, sin desplegar ni publicar nada.
# Correrlo cada vez que se regenere el token, antes de un deploy.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: bhtaecnzpuotlsenbdlz

jobs:
  check:
    name: Leer Edge Functions con el token
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Listar funciones desplegadas (solo lectura)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN está vacío en el Environment production."
            exit 1
          fi
          if ! npx --yes supabase@2.117.0 functions list --project-ref "$SUPABASE_PROJECT_REF" --output-format json > deployed-functions.json; then
            echo "::error::La CLI rechazó el token. Respuesta:"
            cat deployed-functions.json
            exit 1
          fi
          cat deployed-functions.json

      - name: Comparar verify_jwt con supabase/config.toml
        run: node scripts/supabase-verify-jwt-settings.mjs --deployed deployed-functions.json
