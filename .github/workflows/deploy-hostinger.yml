name: Verificar y publicar Litoral Maq

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: litoral-maq-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Mismo proyecto que ya referencia NEXT_PUBLIC_SUPABASE_URL más abajo. No es
  # secreto (es el ref público del proyecto, visible en su URL del dashboard).
  SUPABASE_PROJECT_REF: bhtaecnzpuotlsenbdlz

jobs:
  verify:
    name: Verificar, compilar y empaquetar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar el proyecto
        run: |
          npx tsc --noEmit
          npm run lint
          npm test

      - name: Instalar navegador para E2E
        run: npx playwright install --with-deps chromium

      # Cuando exista el proyecto aislado de staging, estos secrets harán que
      # Playwright use Supabase real. Nunca deben apuntar a producción.
      - name: Validar destino E2E
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          PRODUCTION_SUPABASE_URL: https://bhtaecnzpuotlsenbdlz.supabase.co
        run: node scripts/validate-e2e-environment.mjs

      - name: Pruebas E2E
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
        run: npx playwright test

      - name: Guardar reporte de E2E si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

      # El deploy usa exclusivamente el catálogo versionado en el commit.
      # Actualizar desde Sheets es una operación separada, revisable por PR.
      - name: Validar catálogo versionado
        run: npm run validate:catalog

      - name: Compilar tienda
        env:
          NEXT_PUBLIC_STORE_DOMAIN: litoralmaq.com
          NEXT_PUBLIC_ADMIN_DOMAIN: admin.litoralmaq.com
          NEXT_PUBLIC_PERSISTENCE_PROVIDER: supabase
          NEXT_PUBLIC_MERCADO_PAGO_ENABLED: ${{ vars.NEXT_PUBLIC_MERCADO_PAGO_ENABLED || 'false' }}
          NEXT_PUBLIC_SHIPPING_ENABLED: ${{ vars.NEXT_PUBLIC_SHIPPING_ENABLED || 'false' }}
          NEXT_PUBLIC_SUPABASE_URL: https://bhtaecnzpuotlsenbdlz.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ot0t-AIGmUf53YpE1eb60A_awTiE0FQ
        run: npm run build:hostinger

      - name: Compilar administración
        env:
          NEXT_PUBLIC_STORE_DOMAIN: litoralmaq.com
          NEXT_PUBLIC_ADMIN_DOMAIN: admin.litoralmaq.com
          NEXT_PUBLIC_PERSISTENCE_PROVIDER: supabase
          NEXT_PUBLIC_MERCADO_PAGO_ENABLED: ${{ vars.NEXT_PUBLIC_MERCADO_PAGO_ENABLED || 'false' }}
          NEXT_PUBLIC_SHIPPING_ENABLED: ${{ vars.NEXT_PUBLIC_SHIPPING_ENABLED || 'false' }}
          NEXT_PUBLIC_SUPABASE_URL: https://bhtaecnzpuotlsenbdlz.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ot0t-AIGmUf53YpE1eb60A_awTiE0FQ
        run: npm run build:admin

      - name: Validar separación de artefactos
        run: npm run validate:separation

      - name: Firmar artefactos y catálogo
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_REF: ${{ github.ref }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
        run: node scripts/create-deployment-manifest.mjs

      - name: Guardar artefacto reproducible
        uses: actions/upload-artifact@v4
        with:
          name: litoral-maq-${{ github.sha }}
          path: |
            hostinger-ready/
            admin-ready/
            src/data/products.json
            deployment-manifest.json
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------
  # Supabase: valida, planifica y despliega migraciones + Edge Functions.
  #
  # En PR solo valida y reporta (sin credenciales de producción). En main,
  # forma parte de la MISMA corrida que publica Hostinger: el job "deploy"
  # de más abajo no arranca hasta que "supabase_deploy_gate" confirme que
  # el backend quedó en un estado compatible. Así el frontend nunca se
  # publica antes (ni después) de lo que soporta el backend desplegado.
  # ---------------------------------------------------------------------

  supabase_check:
    name: "Supabase · validar y detectar cambios"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      functions: ${{ steps.affected.outputs.functions }}
      functions_count: ${{ steps.affected.outputs.functions_count }}
      migrations_changed: ${{ steps.affected.outputs.migrations_changed }}
      config_changed: ${{ steps.affected.outputs.config_changed }}
      supabase_touched: ${{ steps.affected.outputs.supabase_touched }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # necesario para diffear contra la base del PR o el tag de último deploy
          fetch-tags: true

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Preparar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Sin esto, `deno check` no encuentra "@supabase/supabase-js" en un
      # node_modules/: al ver el package.json de la raíz del repo, Deno
      # asume resolución estilo Node y necesita el node_modules real (el
      # mismo paquete que ya usa el frontend, misma versión fijada en
      # supabase/functions/deno.json).
      - name: Instalar dependencias (para que Deno resuelva los imports npm:)
        run: npm ci

      - name: Validar sintaxis de cada Edge Function
        run: |
          set -euo pipefail
          for entry in supabase/functions/*/index.ts; do
            echo "· deno check $entry"
            deno check "$entry"
          done

      - name: Ejecutar pruebas de las funciones compartidas
        run: deno test --permit-no-files supabase/functions/_shared

      - name: Validar supabase/config.toml
        run: node scripts/supabase-validate-config.mjs

      - name: Detectar cambios en supabase/**
        id: affected
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="refs/tags/supabase-last-deploy"
          fi
          node scripts/supabase-affected-functions.mjs --base "$BASE"

      - name: Resumen
        run: |
          {
            echo "## Supabase — cambios detectados"
            echo ""
            echo "- Funciones afectadas: \`${{ steps.affected.outputs.functions }}\`"
            echo "- Migraciones cambiadas: \`${{ steps.affected.outputs.migrations_changed }}\`"
            echo "- config.toml cambiado: \`${{ steps.affected.outputs.config_changed }}\`"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo ""
              echo "_Solo se valida y se informa. Esta PR no despliega ni migra producción._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Solo corre cuando el push realmente tocó supabase/ (funciones, migraciones
  # o config.toml). Un cambio de frontend no necesita credenciales de la base
  # ni debe quedar bloqueado por ellas: no hay backend nuevo que confirmar.
  supabase_plan:
    name: "Supabase · plan de migraciones"
    if: github.event_name != 'pull_request' && needs.supabase_check.outputs.supabase_touched == 'true'
    needs: [verify, supabase_check]
    runs-on: ubuntu-latest
    environment: production
    outputs:
      has_pending_migrations: ${{ steps.plan.outputs.has_pending_migrations }}
      pending_migration_files: ${{ steps.plan.outputs.pending_migration_files }}
      has_destructive: ${{ steps.scan.outputs.has_destructive }}
      destructive_summary: ${{ steps.scan.outputs.destructive_summary }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Preparar conexión a la base (pooler IPv4)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/supabase-db-url.mjs

      - name: Listar migraciones (local vs. remoto)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # En modo json la CLI escribe sus errores a stdout: sin este cat el
          # motivo real quedaba dentro de migration-list.json y el log solo
          # decía "exit code 1".
          if ! npx --yes supabase@2.117.0 migration list \
            --db-url "$DB_URL" \
            --output-format json > migration-list.json; then
            echo "::error::migration list falló. Respuesta de la CLI:"
            cat migration-list.json
            exit 1
          fi

      - name: Decidir si hay migraciones para aplicar
        id: plan
        run: node scripts/supabase-plan-migrations.mjs --migration-list migration-list.json

      - name: Buscar operaciones destructivas en lo pendiente
        id: scan
        if: steps.plan.outputs.has_pending_migrations == 'true'
        run: |
          mapfile -t FILES < <(node -e "process.stdout.write(JSON.parse(process.argv[1]).join('\n'))" '${{ steps.plan.outputs.pending_migration_files }}')
          node scripts/supabase-scan-destructive-sql.mjs "${FILES[@]}"

      - name: Diff completo (solo lectura, no aplica nada)
        if: steps.plan.outputs.has_pending_migrations == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx --yes supabase@2.117.0 db push --dry-run --db-url "$DB_URL"

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Supabase — plan de migraciones"
            echo ""
            echo "- Migraciones pendientes: \`${{ steps.plan.outputs.has_pending_migrations || 'false' }}\`"
            echo "- Archivos: \`${{ steps.plan.outputs.pending_migration_files || '[]' }}\`"
            echo "- Contiene operaciones destructivas: \`${{ steps.scan.outputs.has_destructive || 'false' }}\`"
            if [ -n "${{ steps.scan.outputs.destructive_summary }}" ]; then
              echo "- Detalle: ${{ steps.scan.outputs.destructive_summary }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Gate manual: SOLO se activa cuando supabase_plan detecta DROP TABLE/COLUMN/
  # SCHEMA/DATABASE o TRUNCATE en una migración pendiente. Requiere que el
  # Environment "production-destructive-migration" exista en GitHub con
  # "Required reviewers" configurado — ver el resumen de la PR para el detalle.
  supabase_migrate_approval:
    name: "Supabase · aprobación manual (migración destructiva)"
    if: github.event_name != 'pull_request' && needs.supabase_plan.outputs.has_destructive == 'true'
    needs: supabase_plan
    runs-on: ubuntu-latest
    environment: production-destructive-migration
    steps:
      - name: Confirmación
        run: echo "Migración destructiva aprobada por un revisor humano en el Environment production-destructive-migration."

  supabase_migrate_apply:
    name: "Supabase · aplicar migraciones"
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.supabase_plan.result == 'success' &&
      needs.supabase_plan.outputs.has_pending_migrations == 'true' &&
      (needs.supabase_plan.outputs.has_destructive != 'true' || needs.supabase_migrate_approval.result == 'success')
    needs: [supabase_plan, supabase_migrate_approval]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Preparar conexión a la base (pooler IPv4)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/supabase-db-url.mjs

      - name: Aplicar migraciones con el mecanismo oficial de Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx --yes supabase@2.117.0 db push --db-url "$DB_URL"

      - name: Resumen
        run: |
          {
            echo "## Supabase — migraciones aplicadas"
            echo ""
            echo "\`\`\`"
            echo '${{ needs.supabase_plan.outputs.pending_migration_files }}'
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  supabase_functions_deploy:
    name: "Supabase · desplegar Edge Functions afectadas"
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.supabase_check.result == 'success' &&
      (needs.supabase_plan.result == 'success' || needs.supabase_plan.result == 'skipped') &&
      needs.supabase_check.outputs.functions_count != '0' &&
      (needs.supabase_migrate_apply.result == 'success' || needs.supabase_migrate_apply.result == 'skipped')
    needs: [supabase_check, supabase_plan, supabase_migrate_apply]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Desplegar solo las funciones afectadas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t SLUGS < <(node -e "process.stdout.write(JSON.parse(process.argv[1]).join('\n'))" '${{ needs.supabase_check.outputs.functions }}')
          if [ "${#SLUGS[@]}" -eq 0 ]; then
            echo "Nada para desplegar."
            exit 0
          fi
          echo "Desplegando: ${SLUGS[*]}"
          # Nunca se pasa --no-verify-jwt: la CLI toma verify_jwt de config.toml.
          npx --yes supabase@2.117.0 functions deploy "${SLUGS[@]}" --project-ref "$SUPABASE_PROJECT_REF"

      - name: Confirmar verify_jwt y estado tras el deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx --yes supabase@2.117.0 functions list --project-ref "$SUPABASE_PROJECT_REF" --output-format json > deployed-functions.json
          node scripts/supabase-verify-jwt-settings.mjs --deployed deployed-functions.json

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Supabase — Edge Functions desplegadas"
            echo ""
            echo "- Funciones: \`${{ needs.supabase_check.outputs.functions }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  supabase_deploy_gate:
    name: "Supabase · confirmar backend compatible"
    if: always() && github.event_name != 'pull_request'
    needs:
      - verify
      - supabase_check
      - supabase_plan
      - supabase_migrate_approval
      - supabase_migrate_apply
      - supabase_functions_deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write # para mover el tag supabase-last-deploy
    steps:
      - name: Confirmar que el backend quedó en un estado desplegable
        run: |
          set -euo pipefail
          fail=0
          check() {
            local job="$1" result="$2"
            case "$result" in
              success|skipped) echo "OK    $job: $result" ;;
              *) echo "FAIL  $job: $result"; fail=1 ;;
            esac
          }
          check verify "${{ needs.verify.result }}"
          check supabase_check "${{ needs.supabase_check.result }}"
          check supabase_plan "${{ needs.supabase_plan.result }}"
          check supabase_migrate_approval "${{ needs.supabase_migrate_approval.result }}"
          check supabase_migrate_apply "${{ needs.supabase_migrate_apply.result }}"
          check supabase_functions_deploy "${{ needs.supabase_functions_deploy.result }}"
          if [ "$fail" -eq 1 ]; then
            echo ""
            echo "El backend de Supabase no quedó confirmado en este run: Hostinger NO se publica."
            exit 1
          fi
          echo ""
          echo "Backend de Supabase confirmado: Hostinger puede publicarse."

      - name: Descargar el código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mover el tag de último deploy confirmado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f supabase-last-deploy "${{ github.sha }}"
          git push origin supabase-last-deploy --force

      - name: Resumen final
        run: |
          {
            echo "## Supabase — resumen del deploy"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Migraciones aplicadas en este run: \`${{ needs.supabase_plan.outputs.has_pending_migrations || 'false' }}\`"
            echo "- Migración destructiva (con aprobación manual): \`${{ needs.supabase_plan.outputs.has_destructive || 'false' }}\`"
            echo "- Funciones desplegadas: \`${{ needs.supabase_check.outputs.functions || '[]' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Publicar con backup y rollback
    # Explícito a propósito: cuando los jobs de Supabase se saltan por no tener
    # nada que hacer, la condición implícita de GitHub arrastra ese "skipped"
    # por la cadena y dejaba sin publicar un cambio de frontend perfectamente
    # verificado. Acá sólo importan estas dos cosas, y se dicen con todas las letras.
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.verify.result == 'success' &&
      needs.supabase_deploy_gate.result == 'success'
    needs: [verify, supabase_deploy_gate]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Descargar artefacto verificado
        uses: actions/download-artifact@v4
        with:
          name: litoral-maq-${{ github.sha }}

      - name: Preparar acceso SSH
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HOSTINGER_SSH_KEY" > "$HOME/.ssh/litoral_maq"
          chmod 600 "$HOME/.ssh/litoral_maq"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> "$HOME/.ssh/known_hosts"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Hostinger no respondió al escaneo SSH después de 5 intentos." >&2
              exit 1
            fi
            sleep 5
          done
          sort -u -o "$HOME/.ssh/known_hosts" "$HOME/.ssh/known_hosts"

      - name: Subir release inmutable
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          SSH_COMMAND="ssh -i $HOME/.ssh/litoral_maq -p $HOSTINGER_PORT"
          RELEASE_ROOT="/home/u471562620/deployments/litoral-maq/releases/$RELEASE_ID"
          ssh -i "$HOME/.ssh/litoral_maq" -p "$HOSTINGER_PORT" "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "mkdir -p '$RELEASE_ROOT/store' '$RELEASE_ROOT/admin'"
          rsync -az --delete -e "$SSH_COMMAND" hostinger-ready/ "$HOSTINGER_USER@$HOSTINGER_HOST:$RELEASE_ROOT/store/"
          rsync -az --delete -e "$SSH_COMMAND" admin-ready/ "$HOSTINGER_USER@$HOSTINGER_HOST:$RELEASE_ROOT/admin/"
          rsync -az -e "$SSH_COMMAND" deployment-manifest.json "$HOSTINGER_USER@$HOSTINGER_HOST:$RELEASE_ROOT/deployment-manifest.json"

      - name: Publicar con rollback automático
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          ssh -i "$HOME/.ssh/litoral_maq" -p "$HOSTINGER_PORT" "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "bash -s -- '$RELEASE_ID'" <<'REMOTE_SCRIPT'
          set -euo pipefail

          release_id="$1"
          deploy_root="/home/u471562620/deployments/litoral-maq"
          release_root="$deploy_root/releases/$release_id"
          backup_root="$deploy_root/backups/$(date -u +%Y%m%dT%H%M%SZ)-${release_id:0:12}"
          store_live="/home/u471562620/domains/litoralmaq.com/public_html"
          admin_live="$store_live/admin"

          test -f "$release_root/store/index.html"
          test -f "$release_root/admin/admin.html"
          test -f "$release_root/deployment-manifest.json"
          mkdir -p "$backup_root/store" "$backup_root/admin"
          rsync -a --exclude '/admin/' "$store_live/" "$backup_root/store/"
          rsync -a "$admin_live/" "$backup_root/admin/"

          rollback() {
            echo "El deploy falló; restaurando el backup $backup_root" >&2
            rsync -a --delete --exclude '/admin/' "$backup_root/store/" "$store_live/"
            rsync -a --delete "$backup_root/admin/" "$admin_live/"
          }
          trap rollback ERR

          rsync -a --delete --exclude '/admin/' "$release_root/store/" "$store_live/"
          rsync -a --delete "$release_root/admin/" "$admin_live/"
          test -f "$store_live/index.html"
          test -f "$admin_live/admin.html"

          trap - ERR
          printf '%s\n' "$release_id" > "$deploy_root/current-release"
          printf '%s\n' "$backup_root" > "$deploy_root/last-backup"
          cp "$release_root/deployment-manifest.json" "$deploy_root/current-manifest.json"
          REMOTE_SCRIPT
